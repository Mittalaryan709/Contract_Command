<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" style="background:#0f172a; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="50" y="30" width="1500" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="73" fill="#38bdf8" font-size="24" font-weight="bold">CONTRACTCOMMAND (P07) – DEFENSE PROCUREMENT PLATFORM</text>
  <text x="1200" y="73" fill="#94a3b8" font-size="16">Relational ER Diagram (3NF / MySQL 8.0)</text>

  <!-- ENTITY 1: auth_user -->
  <g transform="translate(650, 150)" filter="url(#shadow)">
    <rect width="280" height="200" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="280" height="40" rx="8" fill="#1d4ed8"/>
    <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="bold">auth_user (User)</text>
    <text x="20" y="65" fill="#f8fafc" font-size="13">PK id : INT (AUTO_INCREMENT)</text>
    <text x="20" y="88" fill="#cbd5e1" font-size="13">username : VARCHAR(150) [UQ]</text>
    <text x="20" y="111" fill="#cbd5e1" font-size="13">email : VARCHAR(254)</text>
    <text x="20" y="134" fill="#cbd5e1" font-size="13">password : VARCHAR(128)</text>
    <text x="20" y="157" fill="#cbd5e1" font-size="13">is_staff, is_active : BOOLEAN</text>
    <text x="20" y="180" fill="#94a3b8" font-size="12">date_joined : DATETIME</text>
  </g>

  <!-- ENTITY 2: accounts_userprofile -->
  <g transform="translate(1000, 150)" filter="url(#shadow)">
    <rect width="280" height="180" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="280" height="40" rx="8" fill="#2563eb"/>
    <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="bold">accounts_userprofile</text>
    <text x="20" y="65" fill="#f8fafc" font-size="13">PK id : BIGINT</text>
    <text x="20" y="88" fill="#38bdf8" font-size="13">FK user_id : INT [1:1, UQ]</text>
    <text x="20" y="111" fill="#cbd5e1" font-size="13">designation : VARCHAR(50)</text>
    <text x="20" y="134" fill="#cbd5e1" font-size="13">phone, department : VARCHAR</text>
    <text x="20" y="157" fill="#cbd5e1" font-size="13">city : VARCHAR(100)</text>
  </g>

  <!-- ENTITY 3: vendors_vendor -->
  <g transform="translate(80, 260)" filter="url(#shadow)">
    <rect width="320" height="280" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="320" height="40" rx="8" fill="#059669"/>
    <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="bold">vendors_vendor (Vendor)</text>
    <text x="20" y="65" fill="#f8fafc" font-size="13">PK id : BIGINT (AUTO_INCREMENT)</text>
    <text x="20" y="88" fill="#cbd5e1" font-size="13">vendor_code : VARCHAR(20) [UQ]</text>
    <text x="20" y="111" fill="#cbd5e1" font-size="13">company_name : VARCHAR(255)</text>
    <text x="20" y="134" fill="#cbd5e1" font-size="13">category : VARCHAR(50)</text>
    <text x="20" y="157" fill="#cbd5e1" font-size="13">email : VARCHAR(254) [UQ]</text>
    <text x="20" y="180" fill="#cbd5e1" font-size="13">phone : VARCHAR(15)</text>
    <text x="20" y="203" fill="#cbd5e1" font-size="13">gst_number, pan_number : VARCHAR</text>
    <text x="20" y="226" fill="#cbd5e1" font-size="13">status : VARCHAR(20)</text>
    <text x="20" y="249" fill="#38bdf8" font-size="13">FK registered_by_id : INT</text>
  </g>

  <!-- ENTITY 4: vendors_evaluation -->
  <g transform="translate(80, 600)" filter="url(#shadow)">
    <rect width="320" height="240" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="320" height="40" rx="8" fill="#047857"/>
    <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="bold">vendors_evaluation</text>
    <text x="20" y="65" fill="#f8fafc" font-size="13">PK id : BIGINT</text>
    <text x="20" y="88" fill="#38bdf8" font-size="13">FK vendor_id : BIGINT [N:1]</text>
    <text x="20" y="111" fill="#38bdf8" font-size="13">FK evaluated_by_id : INT [N:1]</text>
    <text x="20" y="134" fill="#cbd5e1" font-size="13">quality, delivery, pricing : DECIMAL</text>
    <text x="20" y="157" fill="#cbd5e1" font-size="13">compliance, overall_score : DECIMAL</text>
    <text x="20" y="180" fill="#cbd5e1" font-size="13">recommendation : VARCHAR(20)</text>
    <text x="20" y="203" fill="#94a3b8" font-size="12">evaluation_date : DATE</text>
  </g>

  <!-- ENTITY 5: contracts_contract -->
  <g transform="translate(500, 480)" filter="url(#shadow)">
    <rect width="340" height="280" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="340" height="40" rx="8" fill="#7c3aed"/>
    <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="bold">contracts_contract</text>
    <text x="20" y="65" fill="#f8fafc" font-size="13">PK id : BIGINT (AUTO_INCREMENT)</text>
    <text x="20" y="88" fill="#cbd5e1" font-size="13">contract_number : VARCHAR(20) [UQ]</text>
    <text x="20" y="111" fill="#cbd5e1" font-size="13">title : VARCHAR(255)</text>
    <text x="20" y="134" fill="#cbd5e1" font-size="13">contract_type : VARCHAR(50)</text>
    <text x="20" y="157" fill="#38bdf8" font-size="13">FK vendor_id : BIGINT [N:1]</text>
    <text x="20" y="180" fill="#cbd5e1" font-size="13">value : DECIMAL(15,2)</text>
    <text x="20" y="203" fill="#cbd5e1" font-size="13">start_date, end_date : DATE</text>
    <text x="20" y="226" fill="#cbd5e1" font-size="13">status : VARCHAR(20)</text>
    <text x="20" y="249" fill="#38bdf8" font-size="13">FK created_by_id : INT</text>
  </g>

  <!-- ENTITY 6: contracts_contractdocument -->
  <g transform="translate(500, 830)" filter="url(#shadow)">
    <rect width="340" height="180" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="340" height="40" rx="8" fill="#6d28d9"/>
    <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="bold">contracts_contractdocument</text>
    <text x="20" y="65" fill="#f8fafc" font-size="13">PK id : BIGINT</text>
    <text x="20" y="88" fill="#38bdf8" font-size="13">FK contract_id : BIGINT [N:1]</text>
    <text x="20" y="111" fill="#cbd5e1" font-size="13">title : VARCHAR(255)</text>
    <text x="20" y="134" fill="#cbd5e1" font-size="13">file_name, file_path : VARCHAR</text>
    <text x="20" y="157" fill="#38bdf8" font-size="13">FK uploaded_by_id : INT</text>
  </g>

  <!-- ENTITY 7: procurement_plan -->
  <g transform="translate(930, 480)" filter="url(#shadow)">
    <rect width="300" height="230" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="300" height="40" rx="8" fill="#d97706"/>
    <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="bold">procurement_plan</text>
    <text x="20" y="65" fill="#f8fafc" font-size="13">PK id : BIGINT (AUTO_INCREMENT)</text>
    <text x="20" y="88" fill="#cbd5e1" font-size="13">plan_number : VARCHAR(30) [UQ]</text>
    <text x="20" y="111" fill="#cbd5e1" font-size="13">title : VARCHAR(255)</text>
    <text x="20" y="134" fill="#cbd5e1" font-size="13">fiscal_year : VARCHAR(9)</text>
    <text x="20" y="157" fill="#cbd5e1" font-size="13">total_budget : DECIMAL(15,2)</text>
    <text x="20" y="180" fill="#cbd5e1" font-size="13">status : VARCHAR(20)</text>
    <text x="20" y="203" fill="#38bdf8" font-size="13">FK created_by_id : INT</text>
  </g>

  <!-- ENTITY 8: procurement_requisition -->
  <g transform="translate(1270, 480)" filter="url(#shadow)">
    <rect width="300" height="250" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="300" height="40" rx="8" fill="#b45309"/>
    <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="bold">procurement_requisition</text>
    <text x="20" y="65" fill="#f8fafc" font-size="13">PK id : BIGINT</text>
    <text x="20" y="88" fill="#cbd5e1" font-size="13">requisition_number : VARCHAR [UQ]</text>
    <text x="20" y="111" fill="#38bdf8" font-size="13">FK plan_id : BIGINT [N:1]</text>
    <text x="20" y="134" fill="#cbd5e1" font-size="13">priority, status : VARCHAR(20)</text>
    <text x="20" y="157" fill="#cbd5e1" font-size="13">required_by_date : DATE</text>
    <text x="20" y="180" fill="#38bdf8" font-size="13">FK requested_by_id : INT</text>
    <text x="20" y="203" fill="#38bdf8" font-size="13">FK approved_by_id : INT</text>
  </g>

  <!-- ENTITY 9: procurement_requisition_item -->
  <g transform="translate(1270, 790)" filter="url(#shadow)">
    <rect width="300" height="190" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="300" height="40" rx="8" fill="#92400e"/>
    <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="bold">procurement_requisition_item</text>
    <text x="20" y="65" fill="#f8fafc" font-size="13">PK id : BIGINT</text>
    <text x="20" y="88" fill="#38bdf8" font-size="13">FK requisition_id : BIGINT [N:1]</text>
    <text x="20" y="111" fill="#cbd5e1" font-size="13">item_name : VARCHAR(255)</text>
    <text x="20" y="134" fill="#cbd5e1" font-size="13">quantity, unit_price : DECIMAL</text>
    <text x="20" y="157" fill="#cbd5e1" font-size="13">total_price : DECIMAL(15,2)</text>
  </g>

  <!-- ENTITY 10: finance_invoice -->
  <g transform="translate(890, 770)" filter="url(#shadow)">
    <rect width="340" height="260" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <rect width="340" height="40" rx="8" fill="#db2777"/>
    <text x="20" y="26" fill="#ffffff" font-size="16" font-weight="bold">finance_invoice</text>
    <text x="20" y="65" fill="#f8fafc" font-size="13">PK id : BIGINT (AUTO_INCREMENT)</text>
    <text x="20" y="88" fill="#cbd5e1" font-size="13">invoice_number : VARCHAR [UQ]</text>
    <text x="20" y="111" fill="#38bdf8" font-size="13">FK contract_id : BIGINT [N:1]</text>
    <text x="20" y="134" fill="#38bdf8" font-size="13">FK vendor_id : BIGINT [N:1]</text>
    <text x="20" y="157" fill="#cbd5e1" font-size="13">subtotal, tax_amount : DECIMAL</text>
    <text x="20" y="180" fill="#cbd5e1" font-size="13">total_amount : DECIMAL(15,2)</text>
    <text x="20" y="203" fill="#cbd5e1" font-size="13">invoice_date, due_date : DATE</text>
    <text x="20" y="226" fill="#cbd5e1" font-size="13">status : VARCHAR(20)</text>
  </g>

  <!-- Relationship Lines -->
  <!-- User to UserProfile -->
  <path d="M 930 240 L 1000 240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vendor to Evaluation -->
  <path d="M 240 540 L 240 600" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vendor to Contract -->
  <path d="M 400 400 L 500 520" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Contract to ContractDocument -->
  <path d="M 670 760 L 670 830" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Plan to Requisition -->
  <path d="M 1230 580 L 1270 580" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Requisition to Item -->
  <path d="M 1420 730 L 1420 790" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Contract to Invoice -->
  <path d="M 840 680 L 890 800" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>