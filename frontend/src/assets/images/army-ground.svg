<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" fill="none">
  <rect width="400" height="260" rx="12" fill="#0B1F33"/>
  <defs>
    <linearGradient id="armyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#1A365D"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="380" height="240" rx="8" fill="url(#armyBg)" stroke="#334E68" stroke-width="1.5"/>
  <!-- Tactical Grid -->
  <path d="M20 70 H380 M20 130 H380 M20 190 H380 M100 20 V240 M200 20 V240 M300 20 V240" stroke="#334E68" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <!-- Armoured Silhouette -->
  <g transform="translate(90, 85)" fill="#E58A24" opacity="0.9">
    <rect x="30" y="55" width="160" height="30" rx="6"/>
    <polygon points="50,55 70,30 150,30 170,55"/>
    <rect x="90" y="15" width="40" height="18" rx="4"/>
    <rect x="0" y="20" width="100" height="6" rx="2" fill="#FFFFFF"/>
    <!-- Wheels -->
    <circle cx="50" cy="85" r="14" fill="#0B1F33" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="85" cy="85" r="14" fill="#0B1F33" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="120" cy="85" r="14" fill="#0B1F33" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="155" cy="85" r="14" fill="#0B1F33" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="190" cy="85" r="14" fill="#0B1F33" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <text x="30" y="45" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" letter-spacing="1">LAND DEFENCE SYSTEMS</text>
  <text x="30" y="228" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#9FB3C8">Tactical Mobility & Advanced Armoured Platforms</text>
  <rect x="330" y="25" width="40" height="20" rx="4" fill="#287A4B"/>
  <text x="338" y="39" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF">ARMY</text>
</svg>
