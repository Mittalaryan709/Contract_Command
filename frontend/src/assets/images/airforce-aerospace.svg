<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" fill="none">
  <rect width="400" height="260" rx="12" fill="#0B1F33"/>
  <defs>
    <linearGradient id="airBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#243B53"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="380" height="240" rx="8" fill="url(#airBg)" stroke="#334E68" stroke-width="1.5"/>
  <!-- Altitude & Flight Path Curves -->
  <path d="M30 180 Q160 160 360 80" stroke="#E58A24" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  <!-- Fighter Jet Vector -->
  <g transform="translate(140, 80) rotate(-15)" fill="#FFFFFF">
    <!-- Fuselage -->
    <path d="M100 25 L30 15 L10 20 L0 25 L10 30 L30 35 Z" fill="#E58A24"/>
    <!-- Delta Wings -->
    <polygon points="55,16 15,2 35,25" fill="#FFFFFF"/>
    <polygon points="55,34 15,48 35,25" fill="#FFFFFF"/>
    <!-- Canards -->
    <polygon points="80,20 68,14 74,25" fill="#334E68"/>
    <polygon points="80,30 68,36 74,25" fill="#334E68"/>
    <!-- Twin Tails -->
    <polygon points="20,23 5,12 12,25" fill="#287A4B"/>
    <polygon points="20,27 5,38 12,25" fill="#287A4B"/>
    <circle cx="90" cy="25" r="2.5" fill="#0B1F33"/>
  </g>
  <text x="30" y="45" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" letter-spacing="1">AEROSPACE & AIR COMBAT</text>
  <text x="30" y="228" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#9FB3C8">Indigenous Fighter Aircraft, Avionics & Propulsion</text>
  <rect x="330" y="25" width="40" height="20" rx="4" fill="#E58A24"/>
  <text x="342" y="39" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF">IAF</text>
</svg>
