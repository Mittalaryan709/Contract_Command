<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" fill="none">
  <rect width="400" height="260" rx="12" fill="#0B1F33"/>
  <defs>
    <linearGradient id="mfgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B42"/>
      <stop offset="100%" stop-color="#1E3E5C"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="380" height="240" rx="8" fill="url(#mfgBg)" stroke="#334E68" stroke-width="1.5"/>
  <!-- Engineering Gears & Robotics -->
  <g transform="translate(140, 65)">
    <!-- Main Gear -->
    <circle cx="60" cy="60" r="36" fill="none" stroke="#E58A24" stroke-width="6" stroke-dasharray="8 4"/>
    <circle cx="60" cy="60" r="20" fill="#102A43" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="60" cy="60" r="8" fill="#287A4B"/>
    <!-- Interlocking Small Gear -->
    <circle cx="108" cy="98" r="24" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="6 3"/>
    <circle cx="108" cy="98" r="10" fill="#102A43" stroke="#E58A24" stroke-width="1.5"/>
    <!-- Tech Caliper Lines -->
    <path d="M-40 20 L-10 60 L-40 100" stroke="#334E68" stroke-width="2"/>
    <line x1="-10" y1="60" x2="20" y2="60" stroke="#E58A24" stroke-width="2"/>
  </g>
  <text x="30" y="45" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" letter-spacing="1">DEFENCE MANUFACTURING</text>
  <text x="30" y="228" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#9FB3C8">DPSUs, Private Defence Corridors & High-Precision CNC</text>
  <rect x="310" y="25" width="60" height="20" rx="4" fill="#287A4B"/>
  <text x="318" y="39" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF">INDUSTRY</text>
</svg>
