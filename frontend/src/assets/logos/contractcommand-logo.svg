<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Shield Emblem -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43" />
      <stop offset="100%" stop-color="#0B1F33" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E58A24" />
      <stop offset="100%" stop-color="#F7A042" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Base Shield -->
    <path d="M25 2 L45 10 V28 C45 40 25 48 25 48 C25 48 5 40 5 28 V10 Z" fill="url(#shieldGrad)" stroke="#E58A24" stroke-width="2" />
    
    <!-- Inner Tactical Chevrons -->
    <path d="M25 12 L37 20 L25 28 L13 20 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M25 24 L33 29 L25 35 L17 29 Z" fill="none" stroke="url(#saffronGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="25" cy="20" r="2.5" fill="#287A4B" />

    <!-- Subtle Tricolour Accent Dots -->
    <circle cx="18" cy="42" r="1.5" fill="#E58A24" />
    <circle cx="25" cy="44" r="1.5" fill="#FFFFFF" />
    <circle cx="32" cy="42" r="1.5" fill="#287A4B" />
  </g>

  <!-- Typography -->
  <text x="68" y="32" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="0.5">
    Contract<tspan fill="#E58A24">Command</tspan>
  </text>
  <text x="69" y="47" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="9" fill="#9FB3C8" letter-spacing="1.2">
    DEFENCE PROCUREMENT PLATFORM
  </text>
</svg>
